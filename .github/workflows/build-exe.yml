name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py ankuan_automation.py ankuan_config.py ankuan_runtime.py ankuan_manual_flow.py parser.py word_writer.py template_builder.py result_ocr.py

      - name: Validate Win32 INPUT structure
        shell: pwsh
        run: |
          python -c "import ctypes; from ankuan_runtime import INPUT; s=ctypes.sizeof(INPUT); print('INPUT size=', s); assert s == 40, s"

      - name: Validate config/profile defaults
        shell: pwsh
        run: |
          python -c "from ankuan_config import DEFAULT_CONFIG, POINT_KEYS; assert all(k in DEFAULT_CONFIG['points'] for k in POINT_KEYS); assert DEFAULT_CONFIG['report']['inspection_history_count'] >= 1"

      - name: Build Word template
        run: python template_builder.py

      - name: Build full Windows EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "安管自動化"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          --collect-all winocr
          --collect-all winrt
          app.py

      - name: Verify full EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'dist/安管自動化.exe'
          Write-Host "EXE size: $($exe.Length) bytes"
          if ($exe.Length -lt 5000000) {
            throw "EXE 過小，疑似不是完整 PyInstaller runtime：$($exe.Length) bytes"
          }
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $b1 = $fs.ReadByte(); $b2 = $fs.ReadByte()
          }
          finally { $fs.Dispose() }
          if ($b1 -ne 0x4D -or $b2 -ne 0x5A) { throw 'EXE Header 不是 MZ' }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          "$($hash.Hash) *安管自動化.exe" | Set-Content 'dist/SHA256.txt' -Encoding ASCII
          Write-Host "SHA256: $($hash.Hash)"

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 安管自動化-Windows
          path: |
            dist/安管自動化.exe
            dist/SHA256.txt
          if-no-files-found: error

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.1
        run: |
          $main = "dist/安管自動化.exe"
          $sha = "dist/SHA256.txt"
          $probe = "dist/ankuan_ui_probe.exe"
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $main $sha $probe --clobber
          } else {
            gh release create $env:TAG $main $sha $probe --title "安管自動化 v0.4.1" --notes "恢復完整 PyInstaller Windows x64 封裝，不再使用小型 PowerShell wrapper。內含 Python runtime、pywinauto、WinRT/OCR 依賴與固定 Word 範本；維持既有安管自動化、兩份 PDF 解析及 Word 產製流程。"
          }
