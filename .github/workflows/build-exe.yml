name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py ankuan_automation.py ankuan_config.py ankuan_runtime.py ankuan_manual_flow.py parser.py word_writer.py template_builder.py

      - name: Validate Win32 INPUT structure
        shell: pwsh
        run: |
          python -c "import ctypes; from ankuan_runtime import INPUT; s=ctypes.sizeof(INPUT); print('INPUT size=', s); assert s == 40, s"

      - name: Build Word template
        run: python template_builder.py

      - name: Build main EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          app.py

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具
          path: dist/消防安全表自動產製工具.exe

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.2
        run: |
          $main = "dist/消防安全表自動產製工具.exe"
          $releaseMain = "dist/fire_tool.exe"
          $probe = "dist/ankuan_ui_probe.exe"
          Copy-Item $main $releaseMain -Force
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $releaseMain --clobber
            gh release upload $env:TAG $probe --clobber
          } else {
            gh release create $env:TAG $releaseMain $probe --title "消防安全表自動產製工具 v0.3.2" --notes "查詢結果改為人工選擇：工具只負責把場所名稱送入安管並送出查詢，不再讀取舊式結果表格，也不再使用『存檔(CSV)』。使用者在安管畫面選好場所後回工具繼續，匯出場所紀錄表並解析後再以場所名稱、地址二次確認。既有 ankuan_config.json 可沿用。"
          }
