name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py ankuan_automation.py ankuan_config.py ankuan_runtime.py parser.py word_writer.py template_builder.py

      - name: Build Word template
        run: python template_builder.py

      - name: Build main EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          app.py

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具
          path: dist/消防安全表自動產製工具.exe

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0
        run: |
          $main = "dist/消防安全表自動產製工具.exe"
          $releaseMain = "dist/fire_tool.exe"
          $probe = "dist/ankuan_ui_probe.exe"
          Copy-Item $main $releaseMain -Force
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $releaseMain --clobber
            gh release upload $env:TAG $probe --clobber
          } else {
            gh release create $env:TAG $releaseMain $probe --title "消防安全表自動產製工具 v0.3.0" --notes "新增外部 ankuan_config.json 與校正／設定頁：場所名稱、場所編號、查詢、CSV、安全查察、場所紀錄表等控制點可依安管視窗做相對位置校正，不需每次重新打包 EXE。場所名稱查詢改為必須先校正並完成輸入讀回驗證，避免空白條件誤查；另可匯出遮蔽資料內容的控制項診斷 TXT。"
          }
