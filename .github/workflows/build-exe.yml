name: build-windows-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py app_ocr.py ankuan_automation.py ankuan_config.py ankuan_runtime.py ankuan_manual_flow.py ankuan_ocr.py parser.py word_writer.py template_builder.py

      - name: Validate Win32 INPUT structure
        shell: pwsh
        run: |
          python -c "import ctypes; from ankuan_runtime import INPUT; s=ctypes.sizeof(INPUT); print('INPUT size=', s); assert s == 40, s"

      - name: Validate config/profile defaults
        shell: pwsh
        run: |
          python -c "from ankuan_config import DEFAULT_CONFIG, POINT_KEYS; assert all(k in DEFAULT_CONFIG['points'] for k in POINT_KEYS); assert DEFAULT_CONFIG['report']['inspection_history_count'] >= 1; assert 'ocr' in DEFAULT_CONFIG; assert DEFAULT_CONFIG['ocr']['click_x_ratio'] > 0"

      - name: Validate OCR matching and Windows capability probe
        shell: pwsh
        run: |
          python -c "from ankuan_ocr import match_score, windows_ocr_status; assert match_score('大巨蛋','臺北大巨蛋商場') > .95; assert match_score('大巨蛋','臺北大巨萓商場') > .45; print('Windows OCR status:', windows_ocr_status())"

      - name: Build Word template
        run: python template_builder.py

      - name: Build main EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          app_ocr.py

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具
          path: dist/消防安全表自動產製工具.exe

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.1
        run: |
          $main = "dist/消防安全表自動產製工具.exe"
          $releaseMain = "dist/fire_tool.exe"
          $probe = "dist/ankuan_ui_probe.exe"
          Copy-Item $main $releaseMain -Force
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $releaseMain --clobber
            gh release upload $env:TAG $probe --clobber
          } else {
            gh release create $env:TAG $releaseMain $probe --title "消防安全表自動產製工具 v0.4.1" --notes "OCR 候選輔助版：場所查詢送出後，以 Windows 本機繁中 OCR 分析目前畫面可見的結果區，僅提供候選並由使用者確認後才點擊；OCR 0 筆、不可用或辨識失敗均退回原人工選取，不自動捲動。保留場所紀錄表 PDF 二次核對與原有安全查察人工選取流程。"
          }
