name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py ankuan_automation.py ankuan_config.py ankuan_runtime.py ankuan_manual_flow.py parser.py word_writer.py template_builder.py result_ocr.py

      - name: Validate Win32 INPUT structure
        shell: pwsh
        run: |
          python -c "import ctypes; from ankuan_runtime import INPUT; s=ctypes.sizeof(INPUT); print('INPUT size=', s); assert s == 40, s"

      - name: Validate config/profile defaults
        shell: pwsh
        run: |
          python -c "from ankuan_config import DEFAULT_CONFIG, POINT_KEYS; assert all(k in DEFAULT_CONFIG['points'] for k in POINT_KEYS); assert DEFAULT_CONFIG['report']['inspection_history_count'] >= 1"

      - name: Build Word template
        run: python template_builder.py

      - name: Build main EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          --collect-all winocr
          --collect-all winrt
          app.py

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具
          path: dist/消防安全表自動產製工具.exe

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.0
        run: |
          $main = "dist/消防安全表自動產製工具.exe"
          $releaseMain = "dist/fire_tool.exe"
          $probe = "dist/ankuan_ui_probe.exe"
          Copy-Item $main $releaseMain -Force
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $releaseMain --clobber
            gh release upload $env:TAG $probe --clobber
          } else {
            gh release create $env:TAG $releaseMain $probe --title "消防安全表自動產製工具 v0.4.0" --notes "定案版流程：查詢結果與安全查察紀錄皆由人工選擇；工具依序產生『場所紀錄表』與『消防安全檢查紀錄表』兩份 PDF，場所紀錄表可設定最近檢查／申報次數，兩份 PDF 會做場所識別檢查後再產 Word。新增預覽視窗相對定位、外部 ankuan_base_profile.json 基本校正、100%＋最大化標準環境檢查、3 點快速校正與本機微調；不使用 CSV。首次建立基本校正前仍需在標準機完成必要控制點校正。"
          }
