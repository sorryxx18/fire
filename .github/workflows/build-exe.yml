name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Word template
        run: python template_builder.py

      - name: Build EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具"
          --add-data "resources\template.docx;resources"
          app.py

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具
          path: dist/消防安全表自動產製工具.exe

      - name: Publish v0.1.0 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          $asset = "dist/消防安全表自動產製工具.exe"
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --clobber
          } else {
            gh release create $env:TAG $asset --title "消防安全表自動產製工具 v0.1.0" --notes "固定格式 PDF → 制式 Word。單一 Windows EXE，不需要安裝 Python，不使用 AI。"
          }
