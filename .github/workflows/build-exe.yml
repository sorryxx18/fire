name: build-windows-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py app_ocr.py app_test3.py ankuan_automation.py ankuan_config.py ankuan_runtime.py ankuan_manual_flow.py parser.py word_writer.py template_builder.py result_ocr.py

      - name: Validate Win32 INPUT structure
        shell: pwsh
        run: |
          python -c "import ctypes; from ankuan_runtime import INPUT; s=ctypes.sizeof(INPUT); print('INPUT size=', s); assert s == 40, s"

      - name: Validate embedded config defaults
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from ankuan_config import DEFAULT_CONFIG, POINT_KEYS; assert all(k in DEFAULT_CONFIG['points'] for k in POINT_KEYS); assert DEFAULT_CONFIG['report']['inspection_history_count'] >= 1; assert DEFAULT_CONFIG['ocr']['click_x_ratio'] > 0; assert DEFAULT_CONFIG['points']['place_name']['x'] == 0.175781; assert DEFAULT_CONFIG['points']['preview_pdf_button']['scope'] == 'preview'; print('embedded standard calibration OK')"

      - name: Validate OCR matching rules
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from result_ocr import match_score; assert match_score('大巨蛋','臺北大巨蛋商場') > .95; assert match_score('大巨蛋','臺北大巨萓商場') > .58; assert match_score('洲際','臺北洲際酒店') > .95; print('OCR matching tests passed')"

      - name: Validate OCR auto-grid and PDF dialog rules
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from result_ocr import OcrWord,_find_result_header; rows=[[OcrWord('其他',0,0,10,10)],[OcrWord('場所編號',0,20,50,10),OcrWord('場所名稱',80,20,50,10),OcrWord('場所地址',160,20,50,10)]]; assert _find_result_header(rows)==1; print('OCR auto-grid header test passed')"
          python -c "from ankuan_runtime import CalibratedAnKuanAutomation as C; assert C._is_pdf_export_dialog_title('匯出到 PDF'); assert C._is_pdf_export_dialog_title('Export to PDF'); assert not C._is_pdf_export_dialog_title('預覽'); print('PDF dialog matcher test passed')"

      - name: Validate TEST3 Desktop-first PDF naming
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import app_test3; p=app_test3._desktop_pdf_target('place_record'); assert p.parent.exists(); assert p.suffix.lower()=='.pdf'; assert '場所紀錄表' in p.name; print('Desktop PDF target=', p)"

      - name: Build Word template
        run: python template_builder.py

      - name: Build main EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "消防安全表自動產製工具_v0.4.2-test3_桌面PDF_內建校正_OCR狀態-PDF匯出修正"
          --add-data "resources\template.docx;resources"
          --collect-all pywinauto
          --collect-all winocr
          --collect-all winrt
          app_test3.py

      - name: Build AnKuan UI probe EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "ankuan_ui_probe"
          --collect-all pywinauto
          uia_probe.py

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 消防安全表自動產製工具_v0.4.2-test3_桌面PDF_內建校正_OCR狀態-PDF匯出修正
          path: dist/消防安全表自動產製工具_v0.4.2-test3_桌面PDF_內建校正_OCR狀態-PDF匯出修正.exe

      - name: Upload UI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankuan-ui-probe
          path: dist/ankuan_ui_probe.exe

      - name: Publish v0.4.1 release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.1
        run: |
          $main = "dist/消防安全表自動產製工具_v0.4.2-test3_桌面PDF_內建校正_OCR狀態-PDF匯出修正.exe"
          $releaseMain = "dist/fire_tool.exe"
          $probe = "dist/ankuan_ui_probe.exe"
          Copy-Item $main $releaseMain -Force
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $releaseMain --clobber
            gh release upload $env:TAG $probe --clobber
          } else {
            gh release create $env:TAG $releaseMain $probe --title "消防安全表自動產製工具 v0.4.1" --notes "OCR 候選輔助版：只分析目前畫面可見的查詢結果；以 Windows 本機 OCR 依 Y 座標聚列、正規化與模糊比對產生候選，單筆／多筆均需人工確認後才點擊。0 筆、OCR 不可用或辨識失敗均退回原人工流程，不自動捲動；支援手動捲動後重新 OCR。點擊採結果列固定安全 X＋列中心 Y，並保留場所紀錄表 PDF 二次核對。"
          }
